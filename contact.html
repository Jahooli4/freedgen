    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col hero-img-wrapper-contact">
                <div class="overlay-contact"></div>
                <div class="col-10 mx-auto hero-text-contact">
                    <h2>Contact Us</h2>
                </div>
                <div class="row">
                    <div class="col-10 col-md-6 mx-auto">

                        <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">

                            <input type="hidden" name="access_key" value="29596c7e-4324-4cbe-b99a-c6bc69d57e7b">
                            <!-- Required: if submitting without Javascript 
         (because by default web3form outputs json) -->

                            <!-- If javascript, use "window.location.hash" for redirects -->
                            <input type="hidden" name="redirect" value="https://web3forms.com/success">

                            <!-- Optional: But Recommended: To Prevent SPAM Submission. 
         Make sure its hidden by default -->
                            <input type="checkbox" name="botcheck" id="" style="display: none;">


                            <div class="row g-3">

                                <div class="col-md-6">
                                    <input type="text" name="name" class="form-control" placeholder="Your Name"
                                        required>
                                </div>

                                <div class="col-md-6">
                                    <input type="email" name="email" class="form-control" placeholder="Your Email"
                                        required>
                                </div>

                                <div class="col-12">
                                    <input type="text" name="subject" class="form-control" placeholder="Subject"
                                        required>
                                </div>

                                <div class="col-12">
                                    <textarea name="message" class="form-control" rows="5" placeholder="Your Message"
                                        required></textarea>
                                </div>

                                <div class="col-12 text-center">
                                    <div class="h-captcha" data-captcha="true"></div>
                                </div>

                                <div class="col-12 text-center">
                                    <button type="submit" class="btn btn-success px-5 py-2">Send Message</button>
                                </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
